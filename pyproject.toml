[project]
name = "langgraph_minio"
version = "0.1.0"
description = "A custom LangGraph-compatible checkpointing system using MinIO"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "minio (>=7.2.15,<8.0.0)",
    "dataclasses-json (>=0.6.7,<0.7.0)",
    "langgraph (>=0.3.28,<0.4.0)",
    "boto3 (==1.37.1)",
    "aioboto3 (==14.1.0)",
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "pyjwt (>=2.10.1,<3.0.0)"
]

[tool.poetry]
name = "langgraph_minio"
version = "0.1.0"
description = "A custom LangGraph-compatible checkpointing system using MinIO"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "langgraph_minio", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
langgraph = ">=0.0.19"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.5.0"
uvicorn = "^0.34.1"
gunicorn = "^23.0.0"
pytest-timeout = "^2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
